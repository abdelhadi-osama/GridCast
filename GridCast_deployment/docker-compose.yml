services:

  # ============================================================
  # MLflow tracking server / model registry
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: gridcast-mlflow

    command: >
      mlflow server
      --host 0.0.0.0
      --port 1010
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlruns
      --serve-artifacts
      --uvicorn-opts "--forwarded-allow-ips=*"
      --allowed-hosts "*"

    ports:
      - "127.0.0.1:1010:1010"

    volumes:
      - ./mlflow:/mlflow
      - ./mlruns:/mlruns

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:1010/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  # ============================================================
  # Online inference API
  # ============================================================
  online:
    build:
      context: .
      dockerfile: online/Dockerfile

    container_name: gridcast-online

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:1010
      ROOT_PATH: /online
    depends_on:
      mlflow:
        condition: service_healthy

    ports:
      - "127.0.0.1:1011:1011"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:1011/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped


  # ============================================================
  # Offline forecasting API
  # ============================================================
  offline:
    build:
      context: .
      dockerfile: offline/Dockerfile

    container_name: gridcast-offline

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:1010
      GRIDCAST_OFFLINE_DATA_DIR: /app/offline/data
      ROOT_PATH: /offline
    volumes:
      - ./offline_data:/app/offline/data

    depends_on:
      mlflow:
        condition: service_healthy

    ports:
      - "127.0.0.1:1012:1012"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:1012/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped


  # ============================================================
  # Streamlit dashboard
  # ============================================================
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile

    container_name: gridcast-dashboard

    environment:
      ONLINE_API_URL: http://online:1011
      OFFLINE_API_URL: http://offline:1012

    depends_on:
      online:
        condition: service_healthy

      offline:
        condition: service_healthy

    ports:
       - "127.0.0.1:1013:1013"

    restart: unless-stopped


  # ============================================================
  # Model evaluator / Prometheus metrics exporter
  # ============================================================
  evaluator:
    build:
      context: ./monitoring/evaluator
      dockerfile: Dockerfile

    container_name: gridcast-evaluator

    env_file:
      - ./monitoring/evaluator/.env

    environment:
      GRIDCAST_OFFLINE_API_URL: http://offline:1012
      METRICS_PORT: "8000"
      POLL_INTERVAL_SECONDS: "300"

    depends_on:
      offline:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest

    container_name: gridcast-prometheus

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:1014:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    restart: unless-stopped


  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:latest

    container_name: gridcast-grafana

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      # Prometheus datasource provisioning
      - ./monitoring/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro

      # Dashboard provider configuration
      - ./monitoring/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro

      # Actual dashboard JSON files
      - ./monitoring/grafana/dashboards/dashboard_model_monitoring.json:/var/lib/grafana/dashboards/dashboard_model_monitoring.json:ro
      - ./monitoring/grafana/dashboards/dashboard_operational.json:/var/lib/grafana/dashboards/dashboard_operational.json:ro
      - ./monitoring/grafana/dashboards/dashboard_business.json:/var/lib/grafana/dashboards/dashboard_business.json:ro

      # Grafana persistent state
      - grafana_data:/var/lib/grafana

    ports:
      - "127.0.0.1:1015:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data: